<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مدير توصيل المطعم</title>
<style>
:root{--p:#7c2d12;--p2:#9a3412;--bg:#f7f4f1;--card:#fff;--txt:#1f2937;--muted:#6b7280;--ok:#047857;--danger:#b91c1c;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:15px;box-shadow:0 3px 14px #0003}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:19px;margin:0}.brand small{opacity:.85}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.tabs button{border:0;padding:10px 4px;border-radius:10px;background:#ffffff20;color:#fff;font-weight:bold}.tabs button.active{background:#fff;color:var(--p)}main{max-width:850px;margin:auto;padding:12px 12px 70px}.view{display:none}.view.active{display:block}.card{background:var(--card);padding:14px;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 12px #00000012}.card h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;background:#fff}textarea{min-height:68px}.btn{width:100%;border:0;border-radius:11px;padding:12px;margin-top:9px;font-weight:bold}.primary{background:var(--p);color:#fff}.ok{background:var(--ok);color:#fff}.secondary{background:#f3f4f6;color:#111827}.danger{background:var(--danger);color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.item{border:1px solid var(--line);padding:12px;border-radius:13px;margin-top:9px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:12px;color:var(--muted);line-height:1.7}.pill{padding:5px 9px;border-radius:99px;background:#f3f4f6;font-size:11px}.money{font-weight:bold;color:var(--p)}.empty{text-align:center;color:var(--muted);padding:20px}.stat{background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 10px #0001}.stat strong{display:block;font-size:20px;color:var(--p)}.toolbar{display:flex;gap:7px}.toolbar>*{flex:1}.hidden{display:none!important}.order-new{border-right:5px solid #2563eb}.order-road{border-right:5px solid #d97706}.order-done{border-right:5px solid var(--ok);opacity:.85}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:11px;padding:10px;font-size:12px}.section-title{margin:16px 2px 7px;font-size:15px}footer{position:fixed;bottom:0;left:0;right:0;text-align:center;background:#fff;border-top:1px solid var(--line);padding:7px;font-size:10px;color:var(--muted)}@media(max-width:500px){.tabs button{font-size:11px}.grid3{grid-template-columns:1fr 1fr}.actions3{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="brand"><div><h1>مدير توصيل المطعم</h1><small>العملاء • الطلبات • السائقون</small></div><span>🚚</span></div><div class="tabs"><button id="dashboardTab" class="active" onclick="showView('dashboard')">الرئيسية</button><button id="customersTab" onclick="showView('customers')">العملاء</button><button id="ordersTab" onclick="showView('orders')">الطلبات</button><button id="driversTab" onclick="showView('drivers')">السائقون</button></div></header>
<main>
<section id="dashboard" class="view active"><div class="grid3" id="stats"></div><div class="card"><h2>بحث سريع برقم الجوال</h2><div class="toolbar"><input id="quickPhone" inputmode="tel" placeholder="05xxxxxxxx"><button class="btn primary" onclick="quickSearch()">بحث</button></div><div id="quickResult"></div></div><div class="card"><h2>الطلبات النشطة</h2><div id="activeOrders"></div></div></section>
<section id="customers" class="view"><div class="card"><h2>إضافة / تعديل عميل</h2><div class="grid"><div><label>رقم الجوال *</label><input id="phone" inputmode="tel"></div><div><label>اسم العميل</label><input id="name"></div></div><label>اسم العنوان</label><select id="label"><option>المنزل</option><option>العمل</option><option>الاستراحة</option><option>عنوان آخر</option></select><label>العنوان التفصيلي</label><textarea id="address"></textarea><div class="grid"><div><label>خط العرض</label><input id="lat" inputmode="decimal"></div><div><label>خط الطول</label><input id="lng" inputmode="decimal"></div></div><button class="btn secondary" onclick="nativeLocation()">📍 التقاط الموقع الحالي</button><label>ملاحظات التوصيل</label><textarea id="notes"></textarea><div class="actions"><button class="btn primary" onclick="saveCustomer()">حفظ العميل</button><button class="btn secondary" onclick="clearCustomerForm()">جديد</button></div></div><div class="card"><div class="top"><h2>سجل العملاء</h2><input id="customerFilter" placeholder="بحث بالاسم أو الرقم" oninput="renderCustomers()" style="max-width:210px"></div><div id="customerList"></div></div></section>
<section id="orders" class="view"><div class="card"><h2>إنشاء طلب جديد</h2><label>رقم جوال العميل *</label><div class="toolbar"><input id="orderPhone" inputmode="tel"><button class="btn secondary" onclick="loadOrderCustomer()">جلب العميل</button></div><div id="orderCustomerInfo" class="small"></div><div class="grid"><div><label>قيمة الطلب (ر.س)</label><input id="amount" inputmode="decimal"></div><div><label>طريقة الدفع</label><select id="payment"><option>نقدي</option><option>شبكة</option><option>مدفوع مسبقًا</option></select></div></div><label>تفاصيل الطلب</label><textarea id="details"></textarea><label>السائق</label><select id="orderDriver"></select><button class="btn ok" onclick="createOrder()">إرسال الطلب للسائق</button></div><div class="card"><div class="top"><h2>سجل الطلبات</h2><select id="orderFilter" onchange="renderOrders()" style="max-width:150px"><option value="all">الكل</option><option>جديد</option><option>في الطريق</option><option>تم التسليم</option><option>ملغي</option></select></div><div id="orderList"></div></div></section>
<section id="drivers" class="view"><div class="card"><h2>إضافة سائق</h2><div class="grid"><div><label>اسم السائق *</label><input id="driverName"></div><div><label>رقم الجوال</label><input id="driverPhone" inputmode="tel"></div></div><button class="btn primary" onclick="saveDriver()">حفظ السائق</button></div><div class="card"><h2>السائقون والتحصيل</h2><div id="driverList"></div></div><div class="card"><h2>النسخ الاحتياطي</h2><div class="notice">البيانات محفوظة على هذا الجهاز. صدّر نسخة احتياطية بصورة دورية.</div><div class="actions"><button class="btn secondary" onclick="exportBackup()">تصدير نسخة</button><button class="btn danger" onclick="clearAllData()">مسح جميع البيانات</button></div></div></section>
</main><footer>الإصدار 2.0 — تطبيق داخلي للمطعم</footer>
<script>
const $=id=>document.getElementById(id),K={c:'rd_customers_v2',o:'rd_orders_v2',d:'rd_drivers_v2'};const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const customers=()=>read(K.c),orders=()=>read(K.o),drivers=()=>read(K.d);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function phone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('00966'))p=p.slice(4);if(p.startsWith('966'))p=p.slice(3);if(p.startsWith('5')&&p.length===9)p='0'+p;return p}function fmtDate(x){return new Date(x).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'})}function showView(v){document.querySelectorAll('.view,.tabs button').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');$(v+'Tab').classList.add('active');refresh()}function refresh(){renderStats();renderCustomers();renderOrders();renderDrivers();renderDriverSelect();renderActiveOrders()}
function nativeLocation(){if(window.Android&&Android.getCurrentLocation)Android.getCurrentLocation();else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>receiveNativeLocation(p.coords.latitude,p.coords.longitude),()=>alert('تعذر تحديد الموقع'))}window.receiveNativeLocation=(a,b)=>{$('lat').value=Number(a).toFixed(6);$('lng').value=Number(b).toFixed(6);alert('تم تحديد الموقع بنجاح')};function openMap(a,b,dir=false){if(!a||!b)return alert('لا توجد إحداثيات محفوظة');if(window.Android)Android.openMap(Number(a),Number(b),dir);else window.open(dir?`https://www.google.com/maps/dir/?api=1&destination=${a},${b}`:`https://www.google.com/maps/search/?api=1&query=${a},${b}`)}function call(p){window.Android?Android.callPhone(p):location.href='tel:'+p}function wa(p,t){window.Android?Android.whatsapp(p,t):window.open('https://wa.me/'+p+'?text='+encodeURIComponent(t))}function share(t){window.Android?Android.shareText(t):navigator.share?.({text:t})}
function saveCustomer(){let p=phone($('phone').value);if(p.length!==10)return alert('أدخل رقم جوال سعودي صحيح');let list=customers(),old=list.find(x=>x.phone===p),c={id:old?.id||Date.now(),phone:p,name:$('name').value.trim(),label:$('label').value,address:$('address').value.trim(),lat:$('lat').value.trim(),lng:$('lng').value.trim(),notes:$('notes').value.trim(),updatedAt:new Date().toISOString()};let i=list.findIndex(x=>x.phone===p);i>=0?list[i]=c:list.unshift(c);write(K.c,list);$('quickPhone').value=p;$('orderPhone').value=p;alert('تم حفظ العميل');refresh()}function editCustomer(id){let c=customers().find(x=>x.id===id);if(!c)return;['phone','name','label','address','lat','lng','notes'].forEach(k=>$(k).value=c[k]||'');scrollTo({top:0,behavior:'smooth'})}function deleteCustomer(id){if(confirm('حذف العميل؟')){write(K.c,customers().filter(x=>x.id!==id));refresh()}}function clearCustomerForm(){['phone','name','address','lat','lng','notes'].forEach(k=>$(k).value='');$('label').value='المنزل'}function customerCard(c){return `<div class="item"><div class="top"><strong>${esc(c.name||'عميل بدون اسم')}</strong><span>${esc(c.phone)}</span></div><div class="small">${esc(c.label)} — ${esc(c.address||'لا يوجد عنوان')}<br>${esc(c.notes||'')}</div><div class="actions3"><button class="btn secondary" onclick="editCustomer(${c.id})">تعديل</button><button class="btn ok" onclick="openMap('${c.lat}','${c.lng}')">الموقع</button><button class="btn danger" onclick="deleteCustomer(${c.id})">حذف</button></div></div>`}function renderCustomers(){let q=($('customerFilter')?.value||'').trim(),list=customers().filter(c=>!q||c.phone.includes(phone(q))||c.name.includes(q));if($('customerList'))$('customerList').innerHTML=list.length?list.map(customerCard).join(''):'<div class="empty">لا يوجد عملاء</div>'}
function quickSearch(){let p=phone($('quickPhone').value),c=customers().find(x=>x.phone===p);$('quickResult').innerHTML=c?customerCard(c):'<div class="empty">العميل غير مسجل</div>';if(c)$('orderPhone').value=c.phone}function loadOrderCustomer(){let p=phone($('orderPhone').value),c=customers().find(x=>x.phone===p);$('orderCustomerInfo').innerHTML=c?`العميل: <b>${esc(c.name||'بدون اسم')}</b> — ${esc(c.address)}`:'العميل غير مسجل';return c}
function createOrder(){let c=loadOrderCustomer();if(!c)return alert('احفظ العميل أولًا');let driverId=Number($('orderDriver').value),d=drivers().find(x=>x.id===driverId);let o={id:Date.now(),phone:c.phone,customerId:c.id,customerName:c.name,address:c.address,label:c.label,lat:c.lat,lng:c.lng,notes:c.notes,amount:Number($('amount').value||0),payment:$('payment').value,details:$('details').value.trim(),driverId:driverId||0,driverName:d?.name||'غير محدد',status:'جديد',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};let list=orders();list.unshift(o);write(K.o,list);$('amount').value='';$('details').value='';alert('تم إنشاء الطلب');refresh()}function statusOrder(id,s){let list=orders(),i=list.findIndex(x=>x.id===id);if(i>=0){list[i].status=s;list[i].updatedAt=new Date().toISOString();write(K.o,list);refresh()}}function deleteOrder(id){if(confirm('حذف الطلب نهائيًا؟')){write(K.o,orders().filter(x=>x.id!==id));refresh()}}function orderText(o){return `طلب #${String(o.id).slice(-6)}\nالعميل: ${o.customerName||''}\nالجوال: ${o.phone}\nالعنوان: ${o.address}\nالقيمة: ${o.amount} ر.س\nالدفع: ${o.payment}\nالتفاصيل: ${o.details||''}`}
function orderCard(o){let cls=o.status==='تم التسليم'?'order-done':o.status==='في الطريق'?'order-road':'order-new';return `<div class="item ${cls}"><div class="top"><strong>طلب #${String(o.id).slice(-6)}</strong><span class="pill">${esc(o.status)}</span></div><div><b>${esc(o.customerName||'عميل')}</b> — ${esc(o.phone)}</div><div class="small">${esc(o.address)}<br>السائق: ${esc(o.driverName)} • ${fmtDate(o.createdAt)}</div><p>${esc(o.details||'لا توجد تفاصيل')}</p><div class="top"><span>${esc(o.payment)}</span><span class="money">${o.amount.toFixed(2)} ر.س</span></div><div class="actions3"><button class="btn ok" onclick="openMap('${o.lat}','${o.lng}',true)">الملاحة</button><button class="btn secondary" onclick="call('${o.phone}')">اتصال</button><button class="btn secondary" onclick="wa('${o.phone}',${JSON.stringify(orderText(o))})">واتساب</button></div><div class="actions3"><button class="btn primary" onclick="statusOrder(${o.id},'في الطريق')">في الطريق</button><button class="btn ok" onclick="statusOrder(${o.id},'تم التسليم')">تم التسليم</button><button class="btn danger" onclick="statusOrder(${o.id},'ملغي')">إلغاء</button></div><div class="actions"><button class="btn secondary" onclick="share(${JSON.stringify(orderText(o))})">مشاركة الطلب</button><button class="btn danger" onclick="deleteOrder(${o.id})">حذف</button></div></div>`}function renderOrders(){if(!$('orderList'))return;let f=$('orderFilter').value,list=orders().filter(o=>f==='all'||o.status===f);$('orderList').innerHTML=list.length?list.map(orderCard).join(''):'<div class="empty">لا توجد طلبات</div>'}function renderActiveOrders(){if(!$('activeOrders'))return;let list=orders().filter(o=>!['تم التسليم','ملغي'].includes(o.status)).slice(0,10);$('activeOrders').innerHTML=list.length?list.map(orderCard).join(''):'<div class="empty">لا توجد طلبات نشطة</div>'}
function saveDriver(){let n=$('driverName').value.trim();if(!n)return alert('أدخل اسم السائق');let list=drivers(),p=phone($('driverPhone').value),old=list.find(x=>x.name===n&&x.phone===p);if(!old)list.push({id:Date.now(),name:n,phone:p,active:true});write(K.d,list);$('driverName').value='';$('driverPhone').value='';refresh()}function toggleDriver(id){let list=drivers(),d=list.find(x=>x.id===id);if(d)d.active=!d.active;write(K.d,list);refresh()}function deleteDriver(id){if(confirm('حذف السائق؟')){write(K.d,drivers().filter(x=>x.id!==id));refresh()}}function renderDriverSelect(){if(!$('orderDriver'))return;let list=drivers().filter(x=>x.active);$('orderDriver').innerHTML='<option value="0">غير محدد</option>'+list.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}function renderDrivers(){if(!$('driverList'))return;let list=drivers(),os=orders();$('driverList').innerHTML=list.length?list.map(d=>{let mine=os.filter(o=>o.driverId===d.id),done=mine.filter(o=>o.status==='تم التسليم'),cash=done.filter(o=>o.payment==='نقدي').reduce((s,o)=>s+o.amount,0);return `<div class="item"><div class="top"><strong>${esc(d.name)}</strong><span class="pill">${d.active?'نشط':'متوقف'}</span></div><div class="small">${esc(d.phone||'بدون رقم')} • الطلبات المسلمة: ${done.length} • التحصيل النقدي: ${cash.toFixed(2)} ر.س</div><div class="actions"><button class="btn secondary" onclick="toggleDriver(${d.id})">تغيير الحالة</button><button class="btn danger" onclick="deleteDriver(${d.id})">حذف</button></div></div>`}).join(''):'<div class="empty">لا يوجد سائقون</div>'}
function renderStats(){if(!$('stats'))return;let os=orders(),today=new Date().toDateString(),tod=os.filter(o=>new Date(o.createdAt).toDateString()===today),sales=tod.filter(o=>o.status==='تم التسليم').reduce((s,o)=>s+o.amount,0);$('stats').innerHTML=`<div class="stat"><strong>${customers().length}</strong><span>العملاء</span></div><div class="stat"><strong>${tod.length}</strong><span>طلبات اليوم</span></div><div class="stat"><strong>${sales.toFixed(2)}</strong><span>مبيعات اليوم</span></div>`}
function exportBackup(){let data=JSON.stringify({version:2,customers:customers(),orders:orders(),drivers:drivers(),createdAt:new Date().toISOString()},null,2);if(window.Android)Android.shareText(data);else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='restaurant-delivery-backup.json';a.click()}}function clearAllData(){if(confirm('سيتم حذف جميع العملاء والطلبات والسائقين. هل أنت متأكد؟')){Object.values(K).forEach(k=>localStorage.removeItem(k));refresh()}}
refresh();
</script></body></html>
